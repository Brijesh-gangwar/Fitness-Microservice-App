server:
  port: ${PORT:8080}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_BASE_URL:http://localhost:8181}/realms/${KEYCLOAK_REALM:fitness-app}/protocol/openid-connect/certs}

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:lb://USER-SERVICE}
          predicates:
            - Path=/api/users/**

        - id: activity-service
          uri: ${ACTIVITY_SERVICE_URI:lb://ACTIVITY-SERVICE}
          predicates:
            - Path=/api/activities/**

        - id: ai-service
          uri: ${AI_SERVICE_URI:lb://AI-SERVICE}
          predicates:
            - Path=/api/recommendations/**


eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_EXTERNAL_URL:http://localhost:8761}/eureka/}

  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:true}
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED:false}
    secure-port: ${EUREKA_SECURE_PORT:443}

services:
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://USER-SERVICE}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
