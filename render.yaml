services:
  - type: web
    name: fitness-configserver
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./configserver/Dockerfile
    dockerContext: ./configserver

  - type: web
    name: fitness-eureka
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./eureka/Dockerfile
    dockerContext: ./eureka

  - type: web
    name: fitness-keycloak
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    dockerCommand: start --optimized --cache=local --import-realm --http-enabled=true --http-port=8080 --hostname-strict=false --proxy-headers=xforwarded
    healthCheckPath: /realms/master/.well-known/openid-configuration
    envVars:
      - key: PORT
        value: "8080"
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: fitness-keycloak-db
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: fitness-keycloak-db
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: fitness-keycloak-db
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: fitness-keycloak-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: fitness-keycloak-db
          property: password

  - type: web
    name: fitness-user-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./userservice/Dockerfile
    dockerContext: ./userservice
    envVars:
      - key: CONFIG_SERVER_URL
        fromService:
          type: web
          name: fitness-configserver
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_EXTERNAL_URL
        fromService:
          type: web
          name: fitness-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_SECURE_PORT_ENABLED
        value: "true"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: USER_DB_CONNECTION_STRING
        fromDatabase:
          name: fitness-user-db
          property: connectionString
      - key: USER_DB_USERNAME
        fromDatabase:
          name: fitness-user-db
          property: user
      - key: USER_DB_PASSWORD
        fromDatabase:
          name: fitness-user-db
          property: password

  - type: web
    name: fitness-activity-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./activityservice/Dockerfile
    dockerContext: ./activityservice
    envVars:
      - key: CONFIG_SERVER_URL
        fromService:
          type: web
          name: fitness-configserver
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_EXTERNAL_URL
        fromService:
          type: web
          name: fitness-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_SECURE_PORT_ENABLED
        value: "true"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: ACTIVITY_MONGODB_URI
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false

  - type: web
    name: fitness-ai-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./aiservice/Dockerfile
    dockerContext: ./aiservice
    envVars:
      - key: CONFIG_SERVER_URL
        fromService:
          type: web
          name: fitness-configserver
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_EXTERNAL_URL
        fromService:
          type: web
          name: fitness-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_SECURE_PORT_ENABLED
        value: "true"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: AI_MONGODB_URI
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: fitness-api-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    envVars:
      - key: CONFIG_SERVER_URL
        fromService:
          type: web
          name: fitness-configserver
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_EXTERNAL_URL
        fromService:
          type: web
          name: fitness-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: EUREKA_SECURE_PORT_ENABLED
        value: "true"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: KEYCLOAK_BASE_URL
        fromService:
          type: web
          name: fitness-keycloak
          envVarKey: RENDER_EXTERNAL_URL
      - key: KEYCLOAK_REALM
        value: fitness-app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173

databases:
  - name: fitness-user-db
    plan: free
    region: singapore

  - name: fitness-keycloak-db
    plan: free
    region: singapore
